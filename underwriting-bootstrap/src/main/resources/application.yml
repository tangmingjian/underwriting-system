server:
  port: 8080

spring:
  application:
    name: underwriting-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/underwriting?useUnicode=true
    username: root
    password: root
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:init_data.sql
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms
  profiles:
    active: mock

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

logging:
  level:
    com.insurance.uw: debug


# ==================== 缓存 TTL 配置 ====================
underwriting:
  cache:
    feature-config-ttl: 600    # 特征配置缓存 10 分钟
    rule-ttl: 300              # 规则缓存 5 分钟
    script-ttl: 1800           # 脚本缓存 30 分钟
  executor:
    core-pool-size: 8
    max-pool-size: 16
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: uw-feature-

# ==================== Nacos 服务发现 ====================
nacos:
  server-addr: 127.0.0.1:8848   # Nacos 服务地址；未部署 Nacos 时 DIRECT 模式不受影响


